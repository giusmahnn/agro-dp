name: Build and Deploy to cPanel (Events Website)

on:
  # Triggers when you push code to the main branch
  push:
    branches:
      - main
      - master
  # Allows you to manually trigger the deployment from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your specific Node version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Static Export
        run: pnpm run build

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /events-agrolocale/ # Make sure this matches your cPanel folder structure